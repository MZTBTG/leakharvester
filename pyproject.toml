[project]
name = "leakharvester"
version = "1.0.0"
description = "High-performance breach data ingestion and analysis engine."
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.9.0",
    "polars[all]>=1.36.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.2.0",
    "pyarrow>=17.0.0",
    "orjson>=3.10.0",
    "pynacl>=1.5.0",
    "zstandard>=0.22.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-sugar>=1.0.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[project.scripts]
leakharvester = "leakharvester.cli.main:app"
